# Despliegue de la API de DINAMYT Membresías en Render.
#
# En el panel de Render: New → Blueprint → apuntar a este repositorio.
#
# Sobre pnpm: NO se usa `corepack enable` ni `npm i -g pnpm`. El sistema de
# archivos de Render es de solo lectura en esas rutas y ambos fallan con EROFS.
# `npx --yes pnpm@<versión>` lo descarga en la carpeta del build y funciona.
#
# Las migraciones NO van aquí: la API las aplica sola al arrancar
# (ver apps/membresias-api/src/main.ts), así el esquema nunca queda desfasado.

services:
  - type: web
    name: dinamyt-membresias-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: >-
      npx --yes pnpm@11.5.0 install --frozen-lockfile &&
      npx --yes pnpm@11.5.0 --filter @dinamyt/membresias-db build &&
      npx --yes pnpm@11.5.0 --filter @dinamyt/membresias-api build
    startCommand: node apps/membresias-api/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "3004"

      # Render pone exactamente un proxy delante. Sin esto, req.ip es la IP de
      # ese proxy para todo el mundo y el rate limit por IP deja de servir.
      - key: TRUST_PROXY_HOPS
        value: "1"

      # Base de datos. En Supabase: la cadena del "Transaction pooler"
      # (puerto 6543), NO la conexión directa — esa solo responde por IPv6 y
      # Render no hace salidas por IPv6.
      - key: MEMBRESIAS_DATABASE_URL
        sync: false

      # Identidad. Render genera el secreto solo: nadie tiene que verlo.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "86400"
      - key: BCRYPT_ROUNDS
        value: "10"

      # Cuenta inicial del superadmin. Se siembra UNA vez, en el primer
      # arranque; cambiarla aquí después no reescribe la contraseña real.
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: SUPERADMIN_NOMBRE
        value: Super administrador

      # Dominio de la web en Vercel. Sin esto el navegador bloquea las
      # peticiones por CORS y la app se ve vacía sin dar ningún error claro.
      - key: CORS_ORIGINS
        sync: false
      - key: MEMBRESIAS_WEB_URL
        sync: false

      # La web (vercel.app) y la API (onrender.com) son sitios DISTINTOS, así
      # que la cookie de sesión es de terceros: con el `lax` por defecto el
      # navegador no la manda y la sesión no sobrevive a recargar la página.
      # `none` obliga a `Secure`, que en Render se cumple solo (todo es HTTPS).
      # Aun así Safari bloquea las cookies de terceros pase lo que pase: la
      # solución de fondo es servir ambos bajo un mismo dominio propio.
      - key: COOKIE_SAMESITE
        value: none

      # Cookie de sesión. Con la web en Vercel y la API aquí son dominios
      # distintos, así que la cookie es de terceros y necesita SameSite=None
      # (+ Secure). Safari la bloqueará igual: para una sesión que aguante en
      # todos los navegadores hay que servir ambas bajo un mismo dominio y
      # entonces bajar esto a "lax".
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_SECURE
        value: "true"

      # Avisos push (opcional). Generar con:
      #   pnpm --filter @dinamyt/membresias-api gen:vapid
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
